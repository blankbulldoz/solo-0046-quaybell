<aside class="tools" aria-label="处理中继消息">
  <h2>操作</h2>
  <details open data-needs-channel>
    <summary>发布消息</summary>
    <form id="publish" class="compact">
      <div class="pair">
        <label>生产者<input name="producer" value="console-publisher" required></label>
        <label>生产键<input name="key" placeholder="sample-001" required></label>
      </div>
      <div class="pair">
        <label>顺序键<input name="lane" value="coil-north" required></label>
        <label>延迟秒数<input name="delay_seconds" type="number" min="0" max="86400" value="0" required></label>
      </div>
      <label>标签<textarea name="tags" rows="2">{"feed":"telemetry"}</textarea></label>
      <label>消息载荷<textarea name="payload" rows="3">{"reading":48,"unit":"mV"}</textarea></label>
      <div class="button-row"><button name="mode" value="preview" class="quiet">预查</button><button name="mode" value="messages">发布</button></div>
      <output class="muted" id="publication-result" aria-live="polite"></output>
    </form>
  </details>
  <details data-needs-channel>
    <summary>设备批次收件</summary>
    <form id="batch" class="compact">
      <p class="muted">分批上传设备批次，封口后整批才进入顺序队列；重启后可用同一批次号继续重发与封口。</p>
      <div class="pair">
        <label>批次键（可留空）<input name="batch_key" placeholder="device-batch-001"></label>
        <label>顺序键<input name="lane" value="coil-north" required></label>
      </div>
      <div class="pair">
        <label>批次号 / 引用<input name="ref" placeholder="建批后自动填入"></label>
        <label>分片序号<input name="index" type="number" min="0" value="0"></label>
      </div>
      <label>分片载荷（JSON）<textarea name="payload" rows="2">{"reading":48,"unit":"mV"}</textarea></label>
      <div class="button-row">
        <button name="mode" value="create">建批</button>
        <button name="mode" value="shard" class="quiet">传分片</button>
        <button name="mode" value="seal">封口</button>
        <button name="mode" value="receipt" type="submit" class="quiet">取回回执</button>
        <button name="mode" value="cancel" class="danger">取消批次</button>
      </div>
      <output class="muted" id="batch-result" aria-live="polite"></output>
    </form>
  </details>
  <details data-needs-channel>
    <summary>领取和应答</summary>
    <form id="claim" class="compact">
      <div class="pair">
        <label>工作进程<input name="worker" value="console-worker" required></label>
        <label>数量<input name="limit" type="number" min="1" max="30" value="1" required></label>
      </div>
      <div class="button-row"><button>领取</button><button type="button" id="toggle-group" class="quiet">暂停取件</button></div>
    </form>
    <div class="leases" id="leases"></div>
  </details>
  <details data-needs-channel>
    <summary>修订策略</summary>
    <form id="revise" class="compact">
      <div class="pair">
        <label>租约秒数<input name="lease_seconds" type="number" min="1" max="300" required></label>
        <label>初始退避秒数<input name="retry_seconds" type="number" min="0" max="300" required></label>
        <label>最大尝试次数<input name="max_attempts" type="number" min="1" max="12" required></label>
        <label>保留秒数<input name="retention_seconds" type="number" min="1" max="604800" required></label>
      </div>
      <button>提交新版</button>
    </form>
  </details>
  <details data-needs-channel>
    <summary>保留复核</summary>
    <div class="compact">
      <p class="muted">清理时会重新检查消息年龄和所有关联投递。</p>
      <div class="button-row"><button type="button" id="retention-plan" class="quiet">查看候选</button><button type="button" id="retention-apply" class="danger" disabled>执行清理</button></div>
      <output class="muted" id="retention-result" aria-live="polite"></output>
    </div>
  </details>
</aside>

<section class="workspace" aria-labelledby="channel-title">
  <header class="workspace-head">
    <div><p class="eyebrow">中继 / 频道</p><h1 id="channel-title">选择频道</h1><span class="muted" id="policy-version"></span></div>
    <button type="button" class="quiet" id="recover" data-needs-channel>回收过期租约</button>
  </header>
  <div class="stats" id="stats" aria-label="投递分类计数"></div>
  <section class="table-section">
    <div class="section-head"><h2>消费组队列</h2><span class="muted" id="queue-group"></span></div>
    <form id="investigate" class="compact">
      <div class="pair">
        <label>调查投递号<input name="delivery_id" type="number" min="1" required inputmode="numeric"
          placeholder="告警单上的分发号"></label>
      </div>
      <div class="button-row"><button name="mode" value="investigate">只读调查</button>
        <button name="mode" value="handoff" class="quiet" type="submit">导出交接证据</button></div>
      <output class="muted" id="investigate-result" aria-live="polite"></output>
    </form>
    <div class="scroll"><table>
      <thead><tr><th scope="col">投递</th><th scope="col">顺序键</th><th scope="col">当前状态</th><th scope="col">队首</th><th scope="col">最早就绪</th></tr></thead>
      <tbody id="queue-rows"></tbody>
    </table></div>
  </section>
  <section class="table-section">
    <div class="section-head"><h2>近期消息</h2><span class="muted" id="message-total"></span></div>
    <div class="scroll"><table>
      <thead><tr><th scope="col">消息</th><th scope="col">生产者</th><th scope="col">生产键</th><th scope="col">策略</th><th scope="col">发布时间</th></tr></thead>
      <tbody id="message-rows"></tbody>
    </table></div>
  </section>
  <section class="table-section">
    <div class="section-head"><h2>死信</h2><span class="muted" id="dead-total"></span></div>
    <div class="scroll"><table>
      <thead><tr><th scope="col">原投递</th><th scope="col">消费组</th><th scope="col">最后原因</th><th scope="col">重投</th></tr></thead>
      <tbody id="dead-rows"></tbody>
    </table></div>
  </section>
  <dialog id="investigation" aria-labelledby="investigation-title">
    <div class="dialog-head">
      <h2 id="investigation-title">积压调查</h2>
      <form method="dialog"><button class="quiet" aria-label="关闭调查结果">关闭</button></form>
    </div>
    <p class="muted" id="investigation-meta"></p>
    <div id="investigation-summary"></div>
    <h3>同顺序键未处置队列</h3>
    <div class="scroll"><table>
      <thead><tr><th scope="col">投递</th><th scope="col">状态</th><th scope="col">队首</th><th scope="col">可采取动作</th><th scope="col">就绪/截止</th></tr></thead>
      <tbody id="investigation-rows"></tbody>
    </table></div>
    <a id="handoff-export" class="button-link">下载交接证据</a>
  </dialog>
</section>
